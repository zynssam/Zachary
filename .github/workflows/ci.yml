name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux libraries for Qt (offscreen) and the X11 hotkey tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0 xvfb xdotool
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy zachary tests
      - name: pytest (Linux, under Xvfb so X11 hotkey tests run)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest
      - name: pytest (Windows)
        if: runner.os == 'Windows'
        run: pytest
