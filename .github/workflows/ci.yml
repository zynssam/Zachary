name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Linux libraries for Qt (offscreen) and the X11 hotkey tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0 xvfb xdotool libportaudio2 espeak-ng
      - run: pip install -e ".[dev]"
      - name: Cache the embedding model (real-model test on one job)
        if: runner.os == 'Linux' && matrix.python == '3.12'
        uses: actions/cache@v4
        with:
          path: ~/.cache/zachary-models
          key: model2vec-potion-base-8M-whisper-tiny
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy zachary tests
      - name: pytest (Linux, under Xvfb so X11 hotkey tests run)
        if: runner.os == 'Linux'
        env:
          ZACHARY_TEST_MODEL: ${{ matrix.python == '3.12' && '1' || '' }}
          # Real local wake word (whisper.cpp tiny + espeak-ng). Gnani is always mocked:
          # CI never calls the real API and has no GNANI_API_KEY.
          ZACHARY_TEST_WHISPER: ${{ matrix.python == '3.12' && '1' || '' }}
        run: xvfb-run -a pytest
      - name: diagnose (temporary)
        if: runner.os == 'Linux' && always()
        continue-on-error: true
        env:
          QT_DEBUG_PLUGINS: "0"
          QT_FATAL_WARNINGS: "0"
        run: |
          xvfb-run -a python -X faulthandler -m pytest -v -s -p no:cacheprovider tests/test_voice.py -k "dictation_rearms or push_to_talk_twice" 2>&1 | tail -80
          xvfb-run -a python -X faulthandler -m pytest -v -p no:cacheprovider tests/test_voice.py 2>&1 | tail -40
      - name: pytest (Windows)
        if: runner.os == 'Windows'
        run: pytest
