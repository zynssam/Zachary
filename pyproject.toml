[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zachary"
version = "0.1.0"
description = "Zachary: a fast desktop assistant with file memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "model2vec>=0.4",  # static embeddings, CPU, no PyTorch
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "httpx>=0.27",  # Gnani REST
    "websockets>=13",  # Gnani streaming STT / TTS
    "sounddevice>=0.4",  # microphone and speaker (PortAudio)
    "pywhispercpp>=1.2",  # offline STT (whisper.cpp)
    "vosk>=0.3.45",  # fast local "Hey Zach" spotting (phrase list, no training)
    "scikit-learn>=1.5",  # HDBSCAN for topics (indexer only, loaded nightly)
    "anthropic>=2.4",  # optional LLM (Phase 6); imported only when enabled
    "send2trash>=1.8",  # Phase 7: removal always goes to the OS trash (undoable)
    "watchdog>=4.0",
    "PySide6-Essentials>=6.6",
    "jeepney>=0.8; sys_platform == 'linux'",  # D-Bus: hotkey portal, file-manager reveal
]

[project.scripts]
zachary = "zachary.cli:main"
zachary-indexer = "zachary.indexer.__main__:main"
zachary-assistant = "zachary.assistant:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-qt>=4.4",
]
build = [
    "pyinstaller>=6.10",  # Phase 8: the Windows / Linux app (packaging/zachary.spec)
]

[tool.setuptools.packages.find]
include = ["zachary*"]

[tool.setuptools.package-data]
zachary = ["py.typed", "ui/assets/*.svg", "ui/assets/*.md", "ui/assets/icons/*", "ui/assets/fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# No PTH (pathlib) rules: hot paths (scanner, watcher, store) use str + os.path for speed.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4"]
ignore = ["SIM905"]  # word lists read better as """...""".split()

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["zachary"]

# sys.platform branches look unreachable on the other OS; CI type-checks both.
[[tool.mypy.overrides]]
module = ["zachary.core.platform", "zachary.core.platform.windows", "zachary.core.platform.linux"]
warn_unreachable = false

# pytest-qt's QtBot key/mouse helpers are untyped.
[[tool.mypy.overrides]]
module = ["tests.test_ui"]
disallow_untyped_calls = false

# Third-party parsers without type stubs (document extraction).
[[tool.mypy.overrides]]
module = ["zachary.indexer.extract", "zachary.indexer.ocr", "tests.semantic_corpus", "tests.test_ocr"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["sqlite_vec", "jeepney", "jeepney.*", "openpyxl", "openpyxl.*", "pptx", "pptx.*",
          "docx", "docx.*", "pymupdf", "model2vec", "model2vec.*", "huggingface_hub",
          "sounddevice", "pywhispercpp", "pywhispercpp.*", "sklearn", "sklearn.*", "send2trash", "vosk"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
